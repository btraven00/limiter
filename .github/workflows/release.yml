name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o limiter-linux-amd64
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o limiter-linux-arm64
        sha256sum limiter-linux-* > checksums.txt
        
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          limiter-linux-amd64
          limiter-linux-arm64
          checksums.txt
